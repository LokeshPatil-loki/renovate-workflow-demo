name: "Update images"

on:
  workflow_dispatch:
    inputs:
      Operator_version:
        type: string
        required: false
        default: "1.3.0" # dynatrace-operator
        description: "Dynatrace Operator version tag"
      OneAgent_version:
        type: string
        required: false
        default: "1.207.43.20250702-125508" # dynatrace-oneagent
        description: "Dynatrace OneAgent version tag"
      Activegate_version:
        type: string
        required: false
        default: "1.307.43.20250702-125508" # dynatrace-oneagent
        description: "Dynatrace OneAgent version tag"
      Codemodules_version:
        type: string
        required: false
        default: "1.307.43.20250702-125508" # dynatrace-oneagent
        description: "Dynatrace OneAgent version tag"

env:
  operator: 1.3.14-fips
jobs:
  display:
    name: "Display versions"
    runs-on: ubuntu-latest
    steps:
      - name: "Set ENV"
        run: |
          echo "operator=$(echo ${{ env.operator }} | sed 's/-fips//')" >> $GITHUB_ENV
      - name: "Display Operator version"
        run: "echo 'public.ecr.aws/dynatrace/dynatrace-operator:${{ env.operator }}'"
